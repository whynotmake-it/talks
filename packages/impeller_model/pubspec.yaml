name: impeller_model
description: "Estimates Impeller GPU pass structure for a Flutter frame, from a widget test."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.47.1 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  # lib/src/capture/binding.dart is public API and subclasses
  # AutomatedTestWidgetsFlutterBinding, so flutter_test must be a regular
  # dependency (the same pattern integration_test uses).
  flutter_test:
    sdk: flutter
  vector_math: ^2.1.4

dev_dependencies:
  lintervention: ^0.3.1
