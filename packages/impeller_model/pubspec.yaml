name: impeller_model
description: "Estimates the Impeller GPU passes, memory traffic and idle frame requests of a Flutter screen from a widget test."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.47.1 <3.48.0"

dependencies:
  device_frame: ">=1.4.0 <2.0.0"
  flutter:
    sdk: flutter
  # lib/src/capture/binding.dart is public API and subclasses
  # AutomatedTestWidgetsFlutterBinding, so flutter_test must be a regular
  # dependency (the same pattern integration_test uses).
  flutter_test:
    sdk: flutter
  path: ^1.9.0
  snaptest: ^0.3.1
  vector_math: ^2.1.4

dev_dependencies:
  lintervention: ^0.3.1
