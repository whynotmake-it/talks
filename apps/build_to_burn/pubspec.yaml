name: build_to_burn
description: "Fluttercon 2026 talk: following one Flutter frame from build to burn."
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.44.0"

dependencies:
  # Keep both refs in sync with the motor override in the root pubspec.yaml.
  example_design:
    git:
      url: https://github.com/whynotmake-it/rivership.git
      ref: aba0c4ca0cff05fe444892bf5fe79a4b921e63ce
      path: packages/example_design
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # Motor 2.0, from the rivership `motor/2.0` integration branch. Its version
  # is still 1.1.0 there; melos publishes it as 2.0.0-dev.0. The pinned commit
  # is kept reachable by the rivership tag talks/motor-2.0-pin-aba0c4c.
  motor:
    git:
      url: https://github.com/whynotmake-it/rivership.git
      ref: aba0c4ca0cff05fe444892bf5fe79a4b921e63ce
      path: packages/motor
  qr_flutter: ^4.1.0
  wnma_talk:
    path: ../../packages/wnma_talk

dev_dependencies:
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1

flutter:
  uses-material-design: true

  assets:
    # From docs.flutter.dev/resources/architectural-overview.
    - assets/images/flutter_docs_trees.png

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-VariableFont_wdth,wght.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
